<!-- Moxie VA IRRRL worksheet: paste into a Lofty "HTML / custom code" block (or any page) that should show the worksheet.
     The worksheet runs inside a sealed frame, so the website's styles can't touch it and it can't touch the website.
     The page and the frame only trade numbers (frame height, scroll position), never client or loan data. -->
<div id="mxva" style="background:#07131F;overflow:hidden;min-height:600px"></div>
<script>
(function(){
  var SRC = "https://rlucido15.github.io/mortgage-calculator/va-irrrl/";
  var w = document.getElementById("mxva"); if (!w || w.firstChild) return;
  var f = document.createElement("iframe");
  f.setAttribute("sandbox", "allow-scripts allow-modals");
  f.setAttribute("referrerpolicy", "no-referrer");
  f.setAttribute("allow", "clipboard-read 'none'; clipboard-write 'none'; camera 'none'; microphone 'none'; geolocation 'none'");
  f.title = "Moxie VA IRRRL worksheet";
  f.style.cssText = "display:block;width:100%;height:1600px;border:0;background:#07131F";
  f.src = SRC;
  w.appendChild(f);
  /* full width: break out of the page's content column */
  function fit(){
    for (var el = w.parentElement; el && el !== document.body; el = el.parentElement){
      var cs = getComputedStyle(el);
      if (/(hidden|clip)/.test(cs.overflowX + cs.overflow)){ el.style.overflow = "visible"; el.style.overflowX = "visible"; }
    }
    w.style.marginLeft = "0px"; w.style.width = "auto"; w.style.maxWidth = "none";
    var l = w.getBoundingClientRect().left;
    w.style.width = document.documentElement.clientWidth + "px"; w.style.marginLeft = (-l) + "px";
  }
  /* tell the worksheet which part of it is on screen (keeps its top bar pinned and the pop-out in view) */
  var tick = false;
  function view(){
    tick = false; if (!f.contentWindow) return;
    var r = f.getBoundingClientRect();
    f.contentWindow.postMessage({ mxLoView: { top: Math.max(0, -r.top), vh: window.innerHeight } }, "*");
  }
  function queue(){ if (!tick){ tick = true; requestAnimationFrame(view); } }
  fit(); document.documentElement.style.overflowX = "hidden";
  window.addEventListener("resize", function(){ fit(); queue(); });
  window.addEventListener("load", function(){ fit(); queue(); });
  window.addEventListener("scroll", queue, { passive: true });
  window.addEventListener("message", function(e){
    if (e.source !== f.contentWindow || !e.data || typeof e.data !== "object") return;
    var d = e.data;
    if (d.mxLo === "height" && typeof d.h === "number" && d.h > 300 && d.h < 20000){ f.style.height = Math.ceil(d.h) + "px"; queue(); }
    if (d.mxLo === "ready") queue();
    if (d.mxLo === "scrollTo" && typeof d.y === "number" && d.y >= 0 && d.y < 20000){
      var top = window.pageYOffset + f.getBoundingClientRect().top + d.y;
      window.scrollTo({ top: top, behavior: "smooth" });
    }
  });
})();
</script>
