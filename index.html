/* =========================================================================
   Moxie Mortgage — Calculator design system
   Plain CSS with custom properties: no Tailwind, no CSS-in-JS, no runtime.
   Scoped under .mxc so it can be embedded in the Lofty CMS without leaking.

   BRAND TOKENS — Moxie's two-colour identity
   Cyan  #28B5CF  =  who we are.  Identity, structure, the loan itself.
   Coral #F46744  =  what to do.  Reserved for the conversion path.

   Keeping those roles separate is what stops the page shouting. Coral is never
   given to a second call to action, so wherever it appears as a button it
   always means "this is the next step". The chart is the one other place the
   warm family shows up — the protection costs are grouped in it deliberately —
   and those are flat segments, not something you can click.

   Both hexes are too light to sit behind white text (2.44:1 and 3.06:1 against
   white; AA needs 4.5:1). Logotypes are exempt from that rule, interface
   elements are not — hence the ramps below. Note the supplied artwork renders
   at #00B5CF, a hair more saturated than the stated brand hex; the inline logo
   is drawn in --mxc-brand-500 so mark and interface agree exactly.
   Every pairing here is asserted in tests/palette.test.ts.
   ========================================================================= */

.mxc {
  /* Cyan — hue-locked ramp from the logo colour */
  --mxc-brand-800: #145a67; /* pressed / deep fills      7.81:1 vs #fff */
  --mxc-brand-700: #197080; /* links, selected chips, focus rings  5.72:1 */
  --mxc-brand-600: #1f8ea2; /* control borders on selection        3.85:1 */
  --mxc-brand-500: #28b5cf; /* THE BRAND CYAN — graphics only      2.44:1 */
  --mxc-brand-100: #d0ecf1;
  --mxc-brand-050: #eff9fa;

  /* Coral — the action colour */
  --mxc-accent-500: #f46744; /* THE BRAND CORAL. Primary CTA fill, with ink
                                text at 5.29:1 — this is the one place the
                                exact hex is load-bearing, so it is not
                                darkened to suit white type. */
  --mxc-accent-600: #ca320c; /* coral that can carry white text     5.29:1 */
  --mxc-accent-700: #b72d0b; /* coral used as TEXT on light         6.19:1 */
  --mxc-accent-550: #f2572f; /* CTA hover — still 4.76:1 under ink text */
  --mxc-accent-050: #fdf1ed;

  /* Ink & surfaces — neutrals carry a trace of the brand hue so a cool cyan
     and a warm coral both look native to the page rather than pasted on. */
  --mxc-ink-900: #0c2330;
  --mxc-ink-700: #2b4150;
  --mxc-ink-500: #5b6f7c;
  --mxc-surface: #ffffff;
  --mxc-canvas: #f4f8fa;
  --mxc-line: #dfe7ec;        /* decorative dividers only */
  --mxc-line-strong: #7f909b; /* control boundaries. Do not lighten: this is
                                 already close to the 1.4.11 floor, at 3.30:1
                                 on white and 3.09:1 on the canvas behind it. */

  /* Payment-breakdown categories, in render order. Cool tones are the loan and
     its taxes; warm tones are the protection costs; grey is everything else —
     so the bar groups meaningfully before a single label is read. Lightness
     alternates dark/light so adjacent segments stay distinct in greyscale and
     under colour-vision deficiency, on top of the swatch, label and amount
     every row already carries. */
  --mxc-cat-pi: #145a67;    /* dark   7.81:1 */
  --mxc-cat-tax: #28b5cf;   /* light  2.44:1 */
  --mxc-cat-ins: #ca320c;   /* coral  5.29:1 — deep brand coral, alternates dark */
  --mxc-cat-mi: #f46744;    /* light  3.06:1 — bright brand coral */
  --mxc-cat-hoa: #566e7e;   /* dark   5.35:1 */
  --mxc-cat-other: #aeb9c1; /* light  2.00:1 */

  /* Feedback */
  --mxc-danger: #b3261e;
  --mxc-danger-bg: #fdf2f0;
  --mxc-warn-bg: #fef7ea;
  --mxc-warn-ink: #7a5a12;

  /* Spacing. One scale, used everywhere — the quickest way to make a dense
     interface feel calm is to stop inventing a new gap for every situation. */
  --mxc-s1: 4px;
  --mxc-s2: 8px;
  --mxc-s3: 12px;
  --mxc-s4: 16px;
  --mxc-s5: 24px;
  --mxc-s6: 32px;
  --mxc-s7: 44px;

  /* Shape & depth. Elevation carries hierarchy so borders do not have to:
     the result card floats, everything else sits flat with a hairline. */
  --mxc-r-sm: 10px;
  --mxc-r-md: 12px;
  --mxc-r-lg: 16px;
  --mxc-shadow-sm: 0 1px 2px rgba(12, 35, 48, 0.04);
  --mxc-shadow-md: 0 1px 2px rgba(12, 35, 48, 0.04), 0 12px 32px -8px rgba(12, 35, 48, 0.12);
  --mxc-shadow-lg: 0 4px 8px rgba(12, 35, 48, 0.05), 0 24px 48px rgba(12, 35, 48, 0.1);

  /* Barlow is the brand typeface. It loads via @font-face (self-hosted in the
     standalone build, so no third-party request and no layout shift). The
     system stack behind it renders identical metrics-adjacent glyphs until the
     web font is ready, and is what shows if it fails to load. */
  --mxc-font: "Barlow", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, sans-serif;

  font-family: var(--mxc-font);
  color: var(--mxc-ink-900);
  background: var(--mxc-surface);
  -webkit-font-smoothing: antialiased;
  line-height: 1.5;
}

.mxc *,
.mxc *::before,
.mxc *::after { box-sizing: border-box; }

.mxc {
  /* Focus ring. Brand cyan is too light to serve as an indicator on white
     (2.47:1, below the 3:1 that 1.4.11/2.4.11 require), so the ring uses the
     deep brand tone. Elements filled with that same tone override the token
     locally so the ring never disappears into its own button. */
  --mxc-focus: var(--mxc-brand-700);
}

.mxc :focus-visible {
  outline: 3px solid var(--mxc-focus);
  outline-offset: 2px;
  border-radius: 4px;
}

.mxc .mxc-btn-primary:focus-visible {
  /* Two-tone ring: a white band separates the outline from the button's own
     fill, so the indicator survives whatever sits behind the card. */
  --mxc-focus: var(--mxc-ink-900);
  box-shadow: 0 0 0 2px var(--mxc-surface);
}

/* Money and other figures never jitter while sliding. */
.mxc [data-numeric] { font-variant-numeric: tabular-nums; }

.mxc-sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ------------------------------------------------------------------ Layout */

.mxc-shell { max-width: 1140px; margin: 0 auto; padding: var(--mxc-s5) var(--mxc-s4) var(--mxc-s7); }

.mxc-hero { max-width: 40rem; margin: 0 0 var(--mxc-s6); }
.mxc-lede { font-size: 1.1875rem; font-weight: 500; line-height: 1.55; color: var(--mxc-ink-700); margin: 0; }

.mxc-grid { display: grid; grid-template-columns: 1fr; gap: var(--mxc-s5); align-items: start; }

/* Left column stacks the inputs box and, beneath it, the reviews card. The
   workspace behind it is white, so the column carries the soft canvas tint as
   a panel — this keeps the white inputs card legible instead of blending into
   an all-white background. */
.mxc-col-inputs {
  display: grid; gap: var(--mxc-s5);
  background: var(--mxc-canvas);
  border-radius: var(--mxc-r-lg);
  padding: var(--mxc-s4);
}
@media (min-width: 640px) { .mxc-col-inputs { padding: var(--mxc-s5); } }

/* MOBILE: the answer comes before the form.
   The calculator opens on real defaults, so there is a genuine number to show
   immediately — leading with it means the first thing on screen is the thing
   the visitor came for, not a form to fill in first. The sticky bar then keeps
   that number in view while they scroll down and edit. */
.mxc-col-results { order: -1; }

@media (min-width: 1000px) {
  .mxc-shell { padding: var(--mxc-s7) var(--mxc-s5) 72px; }
  .mxc-grid { grid-template-columns: minmax(320px, 0.78fr) minmax(0, 1.22fr); gap: var(--mxc-s7); }
  /* On desktop both columns are visible at once, so the natural
     inputs-then-results reading order returns. */
  .mxc-col-results { order: 0; position: sticky; top: var(--mxc-s5); }
}

/* Paired fields. Two compact controls share a row on wider screens and stack
   below 640px, where side-by-side would squeeze the touch targets. */
.mxc-row { display: grid; grid-template-columns: 1fr; gap: var(--mxc-s5); }
@media (min-width: 640px) {
  .mxc-row { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: var(--mxc-s4); align-items: start; }
  /* Home price stays dominant but loan term needs room for "30 years". */
  .mxc-row:first-child { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
}

/* Card header with an optional escape hatch on the right. */
.mxc-card-head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--mxc-s4); margin-bottom: var(--mxc-s5);
}
.mxc-card-head .mxc-card-title { margin-bottom: 0; }
.mxc-reset {
  flex: none; width: auto; min-height: 40px; padding: 8px 12px;
  font-size: 0.875rem; white-space: nowrap;
}

.mxc-card {
  background: var(--mxc-surface);
  border: 1px solid var(--mxc-line);
  border-radius: var(--mxc-r-lg);
  padding: var(--mxc-s5);
}
@media (min-width: 640px) { .mxc-card { padding: var(--mxc-s6); } }

/* A section title should outrank the values inside it. It previously did not:
   at 17px it was smaller than the 18px input text below it. */
.mxc-card-title {
  font-size: 1.1875rem; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 var(--mxc-s5);
}
.mxc-card-sub { font-size: 0.875rem; color: var(--mxc-ink-500); margin: -16px 0 var(--mxc-s5); }

.mxc-stack > * + * { margin-top: var(--mxc-s5); }

/* ------------------------------------------------------------------ Fields */

.mxc-field { display: block; }
/* Labels step back so the value can step forward. They were 15px/600 in full
   ink against an 18px value — near enough in weight that the eye had to sort
   them out. */
.mxc-label {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--mxc-s3);
  font-size: 0.8125rem; font-weight: 600; letter-spacing: 0.01em;
  color: var(--mxc-ink-700); margin-bottom: var(--mxc-s2);
}
.mxc-label-hint { font-size: 0.75rem; font-weight: 500; color: var(--mxc-ink-500); }

.mxc-input-wrap { position: relative; display: flex; align-items: center; }
.mxc-affix {
  position: absolute; pointer-events: none; color: var(--mxc-ink-500);
  font-size: 1.0625rem; font-weight: 500;
}
.mxc-affix-left { left: 16px; }
.mxc-affix-right { right: 16px; }

.mxc-input {
  width: 100%; min-height: 44px; padding: 8px var(--mxc-s4);
  font: inherit; font-size: 1.125rem; font-weight: 600; font-variant-numeric: tabular-nums;
  color: var(--mxc-ink-900); background: var(--mxc-surface);
  border: 1px solid var(--mxc-line-strong); border-radius: var(--mxc-r-md);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
  -moz-appearance: textfield;
}
.mxc-input::-webkit-outer-spin-button,
.mxc-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.mxc-input:hover { border-color: var(--mxc-ink-500); }
.mxc-input:focus { outline: none; border-color: var(--mxc-brand-600); box-shadow: 0 0 0 3px var(--mxc-brand-050); }
.mxc-input.has-prefix { padding-left: 34px; }
.mxc-input.has-suffix { padding-right: 44px; }
.mxc-input.has-stepper { padding-right: 34px; }

/* Compact in-field rate steppers, docked at the right edge. Each is a small
   hit target stacked vertically; together they occupy the space a suffix would.
   Kept out of the tab order (the input's ArrowUp/Down cover keyboard use), so
   they never add a second tab stop for the same nudge. */
.mxc-rate-arrows {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 1px;
}
.mxc-rate-arrow {
  display: flex; align-items: center; justify-content: center;
  width: 22px; height: 18px; padding: 0;
  color: var(--mxc-ink-500); background: transparent;
  border: 0; border-radius: 4px; cursor: pointer;
}
.mxc-rate-arrow:hover { color: var(--mxc-ink-900); background: var(--mxc-canvas); }
.mxc-rate-arrow:focus-visible { outline: 2px solid var(--mxc-focus); outline-offset: 1px; }
.mxc-input[aria-invalid="true"] { border-color: var(--mxc-danger); }
.mxc-input[aria-invalid="true"]:focus { box-shadow: 0 0 0 3px var(--mxc-danger-bg); }

.mxc-msg { display: flex; gap: 7px; align-items: flex-start; font-size: 0.8125rem; margin-top: 8px; }
.mxc-msg-error { color: var(--mxc-danger); font-weight: 550; }
.mxc-msg-warn { color: var(--mxc-warn-ink); }
.mxc-msg-icon { flex: none; margin-top: 1px; font-weight: 700; }

.mxc-help { font-size: 0.8125rem; line-height: 1.45; color: var(--mxc-ink-500); margin: var(--mxc-s2) 0 0; }
/* The ZIP location note spans the full interest-rate/ZIP row rather than sitting
   under the ZIP column alone. It's a direct child of the stack, so it already
   spans edge to edge; this overrides the stack's large inter-item gap so it sits
   close under the row like normal help text. */
.mxc-help-row { margin-top: var(--mxc-s2); }

/* Down payment: one bordered shell holding the affix, a borderless input, and
   the unit toggle docked at the right edge. The whole thing reads and focuses
   like a single field; the toggle sits inside it rather than off in the label
   row. */
.mxc-dp {
  display: flex; align-items: center; gap: var(--mxc-s2);
  min-height: 44px; padding: 0 var(--mxc-s2) 0 var(--mxc-s4);
  background: var(--mxc-surface);
  border: 1px solid var(--mxc-line-strong); border-radius: var(--mxc-r-md);
  transition: border-color 0.15s ease, box-shadow 0.15s ease;
}
.mxc-dp:hover { border-color: var(--mxc-ink-700); }
.mxc-dp:focus-within { border-color: var(--mxc-brand-600); box-shadow: 0 0 0 3px var(--mxc-brand-050); }
.mxc-dp[data-invalid] { border-color: var(--mxc-danger); }
.mxc-dp[data-invalid]:focus-within { box-shadow: 0 0 0 3px var(--mxc-danger-bg); }
.mxc-dp .mxc-affix-left {
  position: static; flex: none; color: var(--mxc-ink-500);
}
.mxc-dp-input {
  flex: 1 1 auto; min-width: 0; width: 100%;
  padding: 0; border: 0; outline: none; background: transparent;
  font: inherit; font-size: 1.125rem; font-weight: 600;
  font-variant-numeric: tabular-nums; color: var(--mxc-ink-900);
}
.mxc-dp .mxc-unit-toggle { flex: none; }

/* Unit toggle. Small, quiet pill; used inside the down-payment field. */
.mxc-label-end { display: inline-flex; align-items: center; gap: var(--mxc-s3); }
.mxc-unit-toggle {
  display: inline-flex; padding: 2px; gap: 2px;
  background: var(--mxc-canvas); border: 1px solid var(--mxc-line); border-radius: 999px;
}
.mxc-unit-toggle button {
  min-width: 34px; min-height: 28px; padding: 0 var(--mxc-s2);
  font: inherit; font-size: 0.8125rem; font-weight: 650; line-height: 1;
  color: var(--mxc-ink-500); background: transparent;
  border: 0; border-radius: 999px; cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
.mxc-unit-toggle button:hover { color: var(--mxc-ink-900); }
.mxc-unit-toggle button[aria-pressed="true"] {
  background: var(--mxc-brand-500); color: var(--mxc-ink-900);
}
.mxc-unit-toggle button[aria-pressed="true"]:focus-visible {
  --mxc-focus: var(--mxc-ink-900);
  box-shadow: 0 0 0 2px var(--mxc-surface);
}

/* Native select, restyled to match the text inputs. The chevron is drawn in
   CSS rather than shipped as an SVG so the control costs nothing extra, and
   `appearance: none` is paired with an explicit background so Safari does not
   keep its own. */
.mxc-select-wrap { position: relative; display: flex; }
.mxc-select {
  appearance: none; -webkit-appearance: none;
  padding-left: 12px; padding-right: 30px; cursor: pointer;
  font-size: 1.0625rem; font-weight: 550;
  text-overflow: ellipsis;
  background-color: var(--mxc-surface);
}
.mxc-select-wrap::after {
  content: ""; position: absolute; right: 13px; top: 50%; pointer-events: none;
  width: 8px; height: 8px; margin-top: -6px;
  border-right: 2px solid var(--mxc-ink-500); border-bottom: 2px solid var(--mxc-ink-500);
  transform: rotate(45deg);
}

/* ------------------------------------------------------- Segmented control */

/* Loan-type chips share one line: a six-column grid rather than wrapping flex,
   so every option is equal width and the row never breaks onto a second line.
   Compact labels (Conv, FHA, VA, USDA, Jumbo, Non-QM) are what make six fit. */
.mxc-seg {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  border: 0; padding: 0; margin: 0;
}
.mxc-seg-legend { padding: 0; }

.mxc-chip { position: relative; min-width: 0; }
.mxc-chip input {
  position: absolute; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer;
}
.mxc-chip span {
  display: flex; align-items: center; justify-content: center;
  min-height: 46px; padding: 10px 10px; white-space: nowrap;
  font-size: 0.875rem; font-weight: 600; color: var(--mxc-ink-700);
  background: var(--mxc-surface); border: 1px solid var(--mxc-line-strong);
  border-radius: 999px; cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
}
.mxc-chip:hover span { border-color: var(--mxc-ink-500); }
.mxc-chip input:checked + span {
  /* The literal brand cyan, with ink type at 6.62:1. Filling with the darker
     ramp step and white type would clear AA too, but it reads as a generic
     teal rather than as Moxie — and a selected state is exactly where the
     brand should be recognisable. */
  background: var(--mxc-brand-500); border-color: var(--mxc-brand-500); color: var(--mxc-ink-900);
}
.mxc-chip input:focus-visible + span {
  outline: 3px solid var(--mxc-focus); outline-offset: 2px;
}
.mxc-chip input:checked:focus-visible + span {
  --mxc-focus: var(--mxc-ink-900);
  box-shadow: 0 0 0 2px var(--mxc-surface);
}

/* ------------------------------------------------------------------ Slider */

.mxc-slider {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 34px; background: transparent; margin: 4px 0 0; cursor: pointer;
}
.mxc-slider::-webkit-slider-runnable-track {
  height: 6px; border-radius: 999px;
  background: linear-gradient(
    to right,
    var(--mxc-brand-500) 0%, var(--mxc-brand-500) var(--mxc-fill, 0%),
    var(--mxc-line) var(--mxc-fill, 0%), var(--mxc-line) 100%
  );
}
.mxc-slider::-moz-range-track { height: 6px; border-radius: 999px; background: var(--mxc-line); }
.mxc-slider::-moz-range-progress { height: 6px; border-radius: 999px; background: var(--mxc-brand-500); }
.mxc-slider::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 28px; height: 28px; margin-top: -11px; border-radius: 50%;
  background: #fff; border: 2px solid var(--mxc-brand-700);
  box-shadow: var(--mxc-shadow-md); cursor: grab;
}
.mxc-slider::-moz-range-thumb {
  width: 28px; height: 28px; border-radius: 50%;
  background: #fff; border: 2px solid var(--mxc-brand-700); box-shadow: var(--mxc-shadow-md);
}
.mxc-slider-scale {
  display: flex; justify-content: space-between;
  font-size: 0.75rem; color: var(--mxc-ink-500); margin-top: -2px;
}

/* ----------------------------------------------------------------- Results */

.mxc-result {
  background: var(--mxc-surface); border: 1px solid var(--mxc-line);
  border-radius: var(--mxc-r-lg); box-shadow: var(--mxc-shadow-md); overflow: hidden;
}

/* The payment hero sits on the brand cyan. Dark ink (#0c2330) on #28b5cf is
   6.62:1 — comfortably AA — so the number, eyebrow and unit are all ink, never
   white (white on cyan is only 2.44:1 and must never be used here). */
.mxc-result-head {
  position: relative;
  background: var(--mxc-ink-900); color: #fff;
  padding: var(--mxc-s6) var(--mxc-s5) var(--mxc-s7);
}
.mxc-result-top { display: block; }
.mxc-result-tick {
  display: block; width: 34px; height: 4px; border-radius: 2px;
  background: var(--mxc-accent-500); margin-bottom: var(--mxc-s4);
}
.mxc-result-label {
  display: inline-block; width: fit-content;
  font-size: 0.8125rem; font-weight: 650; letter-spacing: 0.08em;
  text-transform: uppercase; color: #9fb3bd;
  margin: 0 0 var(--mxc-s2);
}
.mxc-amount { display: flex; align-items: baseline; gap: 6px; }
.mxc-amount-value {
  font-size: clamp(3rem, 12vw, 4rem); font-weight: 700; letter-spacing: -0.04em;
  line-height: 1; font-variant-numeric: tabular-nums; color: #fff;
}
.mxc-amount-unit { font-size: 1.125rem; font-weight: 600; color: #8aa0ab; }

/* Assumption chips: a right-aligned vertical column, vertically centered within
   the dark hero so they sit with equal space above and below rather than pinned
   to the top. Outlined in translucent white so they read on the dark ground. */
.mxc-assump {
  position: absolute; top: 0; bottom: 0; right: var(--mxc-s5);
  list-style: none; margin: 0; padding: 0;
  display: flex; flex-direction: column; align-items: flex-end;
  justify-content: center; gap: 8px;
}
.mxc-assump li {
  font-size: 0.75rem; font-weight: 600; color: #c6d3da;
  border: 1px solid rgba(255, 255, 255, 0.22); border-radius: 999px;
  padding: 3px 11px; white-space: nowrap;
}

.mxc-result-body { padding: var(--mxc-s6) var(--mxc-s5) var(--mxc-s6); }
.mxc-result-body > * + * { margin-top: var(--mxc-s6); }

/* The actions get their own tinted footer. Separating them from the numbers
   means the eye finishes reading the breakdown and then arrives at a decision,
   rather than meeting a wall of buttons underneath a wall of figures. */
.mxc-result-foot {
  padding: var(--mxc-s6) var(--mxc-s5);
  background: var(--mxc-canvas);
  border-top: 1px solid var(--mxc-line);
}

/* Primary action = pre-approval. Slightly larger than a standard button so it
   clearly leads the block. */
.mxc-cta-apply { min-height: 56px; font-size: 1.0625rem; }

/* The effort-objection microcopy, directly under the primary button — this is
   the sentence doing the persuasive work: fast, and no credit-score hit. */
.mxc-cta-effort {
  margin: var(--mxc-s4) 0 0; text-align: center;
  font-size: 0.8125rem; line-height: 1.5; color: var(--mxc-ink-700);
}

/* Secondary row: the genuine fallbacks (save scenario, phone), quieter and
   below the fold of the primary action. */
.mxc-cta-row { display: grid; gap: var(--mxc-s2); }
@media (min-width: 400px) { .mxc-cta-row { grid-template-columns: 1fr 1fr; } }
.mxc-cta-row-secondary { margin-top: var(--mxc-s5); }
.mxc-cta-row-secondary .mxc-cta-phone { margin: 0; }

.mxc-btn.mxc-cta-phone { width: 100%; }
.mxc-cta-taxnote {
  margin: var(--mxc-s5) 0 0; font-size: 0.75rem; line-height: 1.5;
  color: var(--mxc-ink-500); text-align: center;
}


/* Reviews: a standalone dark card in the left column, presented as an
   auto-advancing carousel. Dark ink ground contrasts with the light cards above
   it; white text clears AA (~15:1); Google's logo supplies third-party cred. */
.mxc-reviews {
  background: var(--mxc-ink-900); color: #fff;
  border-radius: var(--mxc-r-lg); padding: var(--mxc-s5);
  box-shadow: var(--mxc-shadow-sm); overflow: hidden;
}
@media (min-width: 640px) { .mxc-reviews { padding: var(--mxc-s5) var(--mxc-s6); } }
.mxc-reviews-title {
  font-size: 1rem; font-weight: 400; line-height: 1.4; letter-spacing: -0.01em;
  margin: 0 0 var(--mxc-s4); color: #eef3f6;
}
.mxc-reviews-title strong { font-weight: 650; color: #fff; }
.mxc-reviews-title-em { display: block; margin-top: 2px; }

.mxc-reviews-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--mxc-s2); margin-bottom: var(--mxc-s3); flex-wrap: wrap;
}
.mxc-reviews-brand { display: inline-flex; align-items: center; gap: 6px; }
.mxc-reviews-brandtext { font-size: 0.8125rem; font-weight: 600; color: #c6d3da; }
.mxc-reviews-rating { display: inline-flex; align-items: center; gap: var(--mxc-s2); }
.mxc-reviews-stars { color: #fbbc05; font-size: 0.9375rem; letter-spacing: 1px; }
.mxc-reviews-score { font-size: 0.8125rem; font-weight: 600; color: #c6d3da; }

/* Carousel viewport + sliding track. */
.mxc-carousel { overflow: hidden; }
.mxc-carousel-track {
  display: flex; list-style: none; margin: 0; padding: 0;
  transition: transform 0.5s ease;
}
@media (prefers-reduced-motion: reduce) {
  .mxc-carousel-track { transition: none; }
}
.mxc-carousel-slide { flex: 0 0 100%; min-width: 0; box-sizing: border-box; }

.mxc-review-card {
  display: flex; flex-direction: column; gap: var(--mxc-s3);
  padding: var(--mxc-s4); min-height: 132px;
  background: #ffffff;
  border: 1px solid var(--mxc-line);
  border-radius: var(--mxc-r-md);
  text-decoration: none; color: inherit;
  transition: background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
}
.mxc-review-card:hover { box-shadow: var(--mxc-shadow-sm); border-color: var(--mxc-line-strong); }
.mxc-review-card:focus-visible { outline: 2px solid var(--mxc-brand-500); outline-offset: 2px; }
.mxc-review-quote {
  margin: 0; font-size: 0.875rem; line-height: 1.5; color: var(--mxc-ink-900);
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
.mxc-review-author { display: flex; align-items: center; gap: var(--mxc-s2); margin-top: auto; }
.mxc-review-avatar {
  width: 36px; height: 36px; border-radius: 999px; flex: none; object-fit: cover;
  background: var(--mxc-line);
}
.mxc-review-avatar-fallback {
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; font-weight: 650; color: #fff; text-transform: uppercase;
  background: var(--mxc-brand-500);
}
.mxc-review-meta { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.mxc-review-name { font-size: 0.8125rem; font-weight: 650; color: var(--mxc-ink-900); }
.mxc-review-sub { font-size: 0.6875rem; color: var(--mxc-ink-500); }
.mxc-review-g { flex: none; opacity: 0.9; }

/* Controls: pause/play + dots. */
.mxc-carousel-controls {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--mxc-s2); margin-top: var(--mxc-s3);
}
.mxc-carousel-toggle {
  font: inherit; font-size: 0.75rem; font-weight: 600; color: #c6d3da;
  background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 999px; padding: 5px 12px; min-height: 30px; cursor: pointer;
}
.mxc-carousel-toggle:hover { color: #fff; background: rgba(255, 255, 255, 0.14); }
.mxc-carousel-toggle:focus-visible { outline: 2px solid var(--mxc-brand-500); outline-offset: 2px; }
.mxc-carousel-dots { display: inline-flex; gap: 6px; }
.mxc-carousel-dot {
  width: 8px; height: 8px; padding: 0; border-radius: 999px; cursor: pointer;
  background: rgba(255, 255, 255, 0.25); border: 0;
  transition: background 0.15s ease, transform 0.15s ease;
}
.mxc-carousel-dot:hover { background: rgba(255, 255, 255, 0.45); }
.mxc-carousel-dot.is-active { background: var(--mxc-brand-500); transform: scale(1.25); }
.mxc-carousel-dot:focus-visible { outline: 2px solid var(--mxc-brand-500); outline-offset: 2px; }

/* Segmented bar — chosen over a donut: it reads at 320px, degrades to a list,
   and never competes with the dollar figure for attention. */
.mxc-bar { display: flex; gap: 3px; height: 10px; margin: 0 0 var(--mxc-s5); }
.mxc-bar-seg { border-radius: 999px; min-width: 4px; transition: flex-grow 0.25s ease; }

.mxc-breakdown { list-style: none; margin: 0; padding: 0; }
/* No rule between every row. Six hairlines under six short lines of text read
   as a table the user has to parse; alignment and rhythm do the same job. */
.mxc-breakdown li {
  display: grid; grid-template-columns: auto 1fr auto; align-items: center;
  gap: var(--mxc-s3); padding: 7px 0;
}
.mxc-dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.mxc-breakdown-name { font-size: 0.9375rem; color: var(--mxc-ink-700); display: flex; align-items: center; gap: 6px; }
.mxc-breakdown-value { font-size: 0.9375rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.mxc-breakdown-share { font-size: 0.75rem; color: var(--mxc-ink-500); font-variant-numeric: tabular-nums; }

/* ----------------------------------------------------------------- Buttons */

.mxc-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: var(--mxc-s3) var(--mxc-s5); width: 100%;
  font: inherit; font-size: 1rem; font-weight: 650; text-align: center; text-decoration: none;
  border-radius: var(--mxc-r-md); border: 1px solid transparent; cursor: pointer;
  transition: background 0.15s ease, border-color 0.15s ease, transform 0.06s ease;
}
.mxc-btn:active { transform: translateY(1px); }
/* The primary action is the one place the literal brand coral is load-bearing.
   It carries ink rather than white type (5.29:1 vs 3.06:1), which keeps the
   exact hex intact instead of darkening it into a red that is no longer Moxie. */
.mxc-btn-primary { background: var(--mxc-accent-500); color: var(--mxc-ink-900); }

/* The Calculate button closes the inputs box; full width, a touch taller so it
   reads as the commit action for everything above it. Dark-themed to anchor the
   box without competing with the coral pre-approval CTA in the results. */
.mxc-calculate {
  width: 100%; min-height: 54px; font-size: 1.05rem; margin-top: var(--mxc-s2);
  background: var(--mxc-ink-900); color: #fff; border-color: var(--mxc-ink-900);
}
.mxc-calculate:hover { background: #16394b; border-color: #16394b; }
.mxc-calculate:disabled { opacity: 0.5; cursor: not-allowed; }

/* Motivational placeholder — occupies the result slot before Calculate, so it
   uses the same dark ground as the payment hero for visual continuity. */
.mxc-placeholder {
  background: var(--mxc-ink-900); color: #fff;
  border: 1px solid var(--mxc-line); border-radius: var(--mxc-r-lg);
  box-shadow: var(--mxc-shadow-md);
  padding: var(--mxc-s7) var(--mxc-s6);
}
.mxc-placeholder-tick {
  display: block; width: 34px; height: 4px; border-radius: 2px;
  background: var(--mxc-accent-500); margin-bottom: var(--mxc-s5);
}
.mxc-placeholder-title {
  font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15;
  color: #fff; margin: 0 0 var(--mxc-s3);
}
.mxc-placeholder-body {
  font-size: 1.0625rem; line-height: 1.5; color: #c6d3da; margin: 0 0 var(--mxc-s5);
}
.mxc-placeholder-list { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--mxc-s3); }
.mxc-placeholder-list li {
  position: relative; padding-left: 26px; font-size: 0.9375rem; line-height: 1.4; color: #eef3f6;
}
.mxc-placeholder-list li::before {
  content: ""; position: absolute; left: 0; top: 6px; width: 10px; height: 10px;
  border-radius: 999px; background: var(--mxc-brand-500);
}
.mxc-btn-primary:hover { background: var(--mxc-accent-550); }
.mxc-btn-secondary { background: var(--mxc-surface); color: var(--mxc-ink-900); border-color: var(--mxc-line-strong); }
.mxc-btn-secondary:hover { border-color: var(--mxc-ink-900); }
.mxc-btn-ghost { font-weight: 600;
  background: transparent; color: var(--mxc-brand-700); border-color: transparent;
  min-height: 44px; width: auto; padding: 10px 12px; font-size: 0.9375rem;
  text-decoration: underline; text-underline-offset: 3px;
}
.mxc-btn[disabled] { opacity: 0.55; cursor: not-allowed; }
/* Secondary actions share a line on anything wider than a small phone, so the
   card ends with one filled button and one quiet row rather than a stack of
   three equal-looking blocks. */
.mxc-btn-row { display: grid; gap: var(--mxc-s2); }
@media (min-width: 420px) { .mxc-btn-row { grid-template-columns: 1fr 1fr; } }

.mxc-deflist { margin: 0; }
.mxc-deflist > div {
  display: flex; justify-content: space-between; gap: var(--mxc-s4); padding: 7px 0;
}
.mxc-deflist dt { font-size: 0.875rem; color: var(--mxc-ink-500); }
.mxc-deflist dd { margin: 0; font-size: 0.875rem; font-weight: 650; font-variant-numeric: tabular-nums; }

/* --------------------------------------------------------- Tax deductions */

/* A panel inside the result card. It earns the separation: everything above it
   is what you pay, this is what you might get back — a different kind of claim,
   from a different set of rules, carrying much heavier caveats. The tint marks
   that boundary without adding another heavy border to the page. */
.mxc-taxbox {
  background: var(--mxc-brand-050);
  border: 1px solid var(--mxc-brand-100);
  border-radius: var(--mxc-r-md);
  overflow: hidden;
}
.mxc-taxbox-body { padding: var(--mxc-s4); }

.mxc-tax-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: var(--mxc-s3); margin-bottom: var(--mxc-s3);
}
.mxc-tax-title { font-size: 0.9375rem; font-weight: 650; margin: 0; }
.mxc-tax-select { flex: none; }
.mxc-tax-select .mxc-select {
  min-height: 36px; padding: 6px 34px 6px 10px;
  font-size: 0.8125rem; font-weight: 600;
  border-color: var(--mxc-brand-100); background-color: var(--mxc-surface);
}
.mxc-select-wrap.mxc-tax-select::after { right: 12px; width: 7px; height: 7px; margin-top: -6px; }

.mxc-taxlist { list-style: none; margin: 0; padding: 0; }
.mxc-taxlist li {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: var(--mxc-s4); padding: 6px 0;
}
.mxc-taxlist-name { font-size: 0.875rem; color: var(--mxc-ink-700); }
.mxc-taxlist-note { display: block; font-size: 0.75rem; color: var(--mxc-ink-500); }
.mxc-taxlist-value { font-size: 0.875rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.mxc-taxlist-total {
  margin-top: var(--mxc-s1); padding-top: var(--mxc-s3) !important;
  border-top: 1px solid var(--mxc-brand-100);
}
.mxc-taxlist-total .mxc-taxlist-name { font-weight: 650; color: var(--mxc-ink-900); }
.mxc-taxlist-total .mxc-taxlist-value { font-size: 1rem; }

/* The verdict carries a left rule rather than a fill, so it reads as a
   conclusion rather than as a promotional callout. */
.mxc-tax-verdict {
  margin: var(--mxc-s3) 0 0; padding-left: var(--mxc-s3);
  border-left: 3px solid var(--mxc-line-strong);
  font-size: 0.8125rem; line-height: 1.5; color: var(--mxc-ink-700);
}
.mxc-tax-verdict.is-positive { border-left-color: var(--mxc-brand-500); }

/* ------------------------------------------------------- Disclosure / details */

.mxc-details { border: 1px solid var(--mxc-line); border-radius: var(--mxc-r-md); background: var(--mxc-surface); }
.mxc-summary {
  display: flex; align-items: center; justify-content: space-between; gap: var(--mxc-s3);
  min-height: 52px; padding: var(--mxc-s3) var(--mxc-s4); cursor: pointer;
  font-size: 0.9375rem; font-weight: 600; list-style: none;
  border-radius: var(--mxc-r-md);
}
.mxc-summary:hover { color: var(--mxc-brand-700); }

/* Quiet disclosure: no box, no fill, just a labelled affordance. Used for
   secondary paths — "Customize your payment", "Loan details" — which should be
   findable without competing with the fields above them. */
.mxc-details-quiet { border: 0; background: transparent; }
.mxc-details-quiet > .mxc-summary {
  padding-left: 0; padding-right: 0; min-height: 40px;
  font-size: 0.875rem; font-weight: 600; color: var(--mxc-brand-700);
  justify-content: flex-start; gap: var(--mxc-s2);
}
.mxc-details-quiet > .mxc-summary::after { margin-left: 0; }
.mxc-details-quiet > .mxc-details-body { padding: 0 0 var(--mxc-s2); }
.mxc-summary::-webkit-details-marker { display: none; }
.mxc-summary::after {
  content: ""; flex: none; width: 9px; height: 9px;
  border-right: 2px solid var(--mxc-ink-500); border-bottom: 2px solid var(--mxc-ink-500);
  transform: rotate(45deg) translateY(-2px); transition: transform 0.2s ease;
}
.mxc-details[open] > .mxc-summary::after { transform: rotate(-135deg) translateY(-2px); }
.mxc-details-body { padding: 0 var(--mxc-s4) var(--mxc-s4); }
.mxc-details-body > * + * { margin-top: var(--mxc-s5); }

.mxc-tip { position: relative; display: inline-flex; }
.mxc-tip-btn {
  width: 20px; height: 20px; padding: 0; border-radius: 50%; cursor: pointer;
  border: 1px solid var(--mxc-line-strong); background: var(--mxc-surface);
  color: var(--mxc-ink-500); font-size: 0.6875rem; font-weight: 700; line-height: 1;
}
.mxc-tip-btn:hover { border-color: var(--mxc-ink-700); color: var(--mxc-ink-900); }
.mxc-tip-pop {
  position: absolute; z-index: 30; bottom: calc(100% + 8px); left: 50%;
  transform: translateX(-50%); width: min(272px, 78vw);
  padding: 12px 14px; font-size: 0.8125rem; font-weight: 400; line-height: 1.45;
  color: var(--mxc-ink-700); text-align: left;
  background: var(--mxc-surface); border: 1px solid var(--mxc-line-strong);
  border-radius: var(--mxc-r-sm); box-shadow: var(--mxc-shadow-lg);
}

/* --------------------------------------------------------------- Lead form */

.mxc-backdrop {
  position: fixed; inset: 0; z-index: 100; display: flex; align-items: flex-end;
  justify-content: center; background: rgba(12, 35, 48, 0.55); padding: 0;
  overflow-y: auto; -webkit-overflow-scrolling: touch;
}
@media (min-width: 700px) { .mxc-backdrop { align-items: center; padding: 32px 16px; } }

.mxc-modal {
  position: relative; width: 100%; max-width: 520px; background: var(--mxc-surface);
  border-radius: var(--mxc-r-lg) var(--mxc-r-lg) 0 0; box-shadow: var(--mxc-shadow-lg);
  padding: 24px 20px calc(24px + env(safe-area-inset-bottom));
  max-height: 92vh; overflow-y: auto;
}
@media (min-width: 700px) { .mxc-modal { border-radius: var(--mxc-r-lg); padding: 30px; } }

.mxc-modal-close {
  position: absolute; top: 14px; right: 14px; width: 40px; height: 40px;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 0; border-radius: 50%; cursor: pointer;
  font-size: 1.25rem; color: var(--mxc-ink-500);
}
.mxc-modal-close:hover { background: var(--mxc-canvas); color: var(--mxc-ink-900); }
.mxc-modal-title { font-size: 1.375rem; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 6px; padding-right: 40px; }
.mxc-modal-sub { font-size: 0.9375rem; color: var(--mxc-ink-500); margin: 0 0 20px; }

.mxc-success-back { margin-top: var(--mxc-s2); }

.mxc-form-grid { display: grid; gap: 16px; }
@media (min-width: 560px) { .mxc-form-two { grid-template-columns: 1fr 1fr; } }
.mxc-form-grid .mxc-input { font-size: 1rem; font-weight: 500; }

.mxc-consent { display: flex; gap: 10px; align-items: flex-start; font-size: 0.8125rem; color: var(--mxc-ink-500); line-height: 1.5; }
.mxc-consent input { width: 22px; height: 22px; margin: 1px 0 0; flex: none; accent-color: var(--mxc-brand-700); }

.mxc-attach {
  background: var(--mxc-canvas); border-radius: var(--mxc-r-md); padding: 14px 16px;
  font-size: 0.8125rem; color: var(--mxc-ink-700);
}
.mxc-attach dl { display: grid; grid-template-columns: auto auto; gap: 4px 16px; margin: 8px 0 0; justify-content: start; }
.mxc-attach dt { color: var(--mxc-ink-500); }
.mxc-attach dd { margin: 0; font-weight: 650; font-variant-numeric: tabular-nums; }

.mxc-success { text-align: center; padding: 10px 0; }
.mxc-success-mark {
  width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 50%;
  background: var(--mxc-brand-050); color: var(--mxc-brand-700);
  display: flex; align-items: center; justify-content: center; font-size: 1.5rem;
}

/* -------------------------------------------------------------- Sticky bar */

.mxc-sticky {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
  display: flex; align-items: center; gap: var(--mxc-s4);
  padding: var(--mxc-s3) var(--mxc-s4) calc(var(--mxc-s3) + env(safe-area-inset-bottom));
  background: rgba(255, 255, 255, 0.96);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  border-top: 1px solid var(--mxc-line); box-shadow: 0 -4px 20px rgba(12, 35, 48, 0.08);
  transform: translateY(100%); transition: transform 0.22s ease;
}
.mxc-sticky[data-visible="true"] { transform: translateY(0); }
.mxc-sticky-figure { flex: 1; min-width: 0; }
.mxc-sticky-label { display: block; font-size: 0.6875rem; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; color: var(--mxc-ink-500); }
.mxc-sticky-value { font-size: 1.25rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.mxc-sticky .mxc-btn { width: auto; min-height: 46px; padding: 12px 18px; font-size: 0.9375rem; }
@media (min-width: 1000px) { .mxc-sticky { display: none; } }
.mxc-sticky-spacer { height: 84px; }
@media (min-width: 1000px) { .mxc-sticky-spacer { display: none; } }

/* ------------------------------------------------------------- SEO content */

.mxc-content { max-width: 42rem; margin: 72px auto 0; }
.mxc-content h2 { font-size: clamp(1.3rem, 3.5vw, 1.6rem); letter-spacing: -0.02em; margin: var(--mxc-s7) 0 var(--mxc-s3); }
.mxc-content h3 { font-size: 1.0625rem; margin: var(--mxc-s5) 0 var(--mxc-s2); }
.mxc-content p { color: var(--mxc-ink-700); line-height: 1.65; margin: 0 0 var(--mxc-s4); }
.mxc-content ul { color: var(--mxc-ink-700); line-height: 1.65; padding-left: 20px; margin: 0 0 var(--mxc-s4); }
.mxc-content li { margin-bottom: 6px; }
.mxc-content .mxc-details + .mxc-details { margin-top: var(--mxc-s2); }

.mxc-legal {
  margin-top: var(--mxc-s6); font-size: 0.75rem; line-height: 1.65; color: var(--mxc-ink-500);
}
.mxc-legal p { margin: 0 0 10px; }

/* --------------------------------------------------------- Reduced motion */

@media (prefers-reduced-motion: reduce) {
  .mxc *, .mxc *::before, .mxc *::after {
    animation-duration: 0.001ms !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

@media (prefers-contrast: more) {
  .mxc { --mxc-line: #9a9a9a; --mxc-line-strong: #6a6a6a; --mxc-ink-500: #3c4750; }
}
</style>
</head>

<div id="root"></div>
<noscript>
  <div style="max-width:46rem;margin:0 auto;padding:32px 16px;font-family:system-ui,sans-serif">
    <h1>Mortgage calculator</h1>
    <p>The interactive calculator needs JavaScript. Your full monthly payment is made up of
       principal and interest on the loan itself, plus property taxes, homeowners insurance,
       mortgage insurance where it applies, and any HOA dues.</p>
    <p>Call Moxie Mortgage at <a href="tel:+14104018688">410.401.8688</a> and we will walk through the
       numbers with you.</p>
  </div>
</noscript>
